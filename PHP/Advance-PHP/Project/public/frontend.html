<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Tasks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="label">Focus Dashboard</div>
    <h1>Pulse Tasks</h1>
    <p class="sub">A colorful daily command center for what matters most.</p>

    <section class="composer">
      <form id="create-form">
        <input id="new-title" type="text" placeholder="What needs to get done?" maxlength="255" />
        <button class="btn-primary" type="submit">Add Task</button>
      </form>
      <div class="status" id="status"></div>
    </section>

    <section class="todos">
      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Todo filters">
          <button type="button" class="active" data-filter="all">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <button type="button" class="btn-soft" id="clear-completed">Clear Completed</button>
      </div>

      <ul class="list" id="todo-list"></ul>
      <div class="stats" id="stats"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
