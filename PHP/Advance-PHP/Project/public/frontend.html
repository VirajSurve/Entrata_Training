<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Tasks</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f3f1eb;
      --card: #f6f5f2;
      --card-strong: #ffffff;
      --text: #1f1d4b;
      --muted: #6f6e86;
      --line: #d8d7df;
      --primary: #ff9442;
      --primary-dark: #f57f27;
      --danger: #ef737d;
      --danger-soft: #ffe8ea;
      --active-pill: #211b46;
      --shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 35%, rgba(211, 231, 217, 0.8), transparent 36%),
        radial-gradient(circle at 86% 70%, rgba(255, 200, 200, 0.55), transparent 32%),
        linear-gradient(115deg, #f2e3c6 0%, #ebedf2 42%, #dbeaf7 100%);
      min-height: 100vh;
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      margin: 42px auto;
      animation: rise 0.35s ease-out;
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      font-weight: 700;
      color: #53527e;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 60px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 24px;
    }

    .composer,
    .todos {
      margin-top: 18px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(246, 245, 242, 0.8);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .composer form {
      display: grid;
      grid-template-columns: 1fr 118px;
      gap: 10px;
    }

    .composer input,
    .edit-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 18px;
      background: #f8f8fa;
      color: var(--text);
      font-family: inherit;
    }

    .composer input:focus,
    .edit-input:focus {
      outline: none;
      border-color: #9ea0c9;
      box-shadow: 0 0 0 3px rgba(159, 163, 215, 0.18);
    }

    .btn-primary,
    .btn-soft,
    .btn-danger,
    .btn-inline {
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-size: 22px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters {
      display: inline-flex;
      gap: 6px;
      background: #efeff5;
      border: 1px solid #dfdfe8;
      border-radius: 999px;
      padding: 5px;
    }

    .filters button {
      border: 0;
      background: transparent;
      color: #656487;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
    }

    .filters button.active {
      background: var(--active-pill);
      color: #fff;
      font-weight: 700;
    }

    .btn-soft {
      background: #f4f4f7;
      color: #1a1a1a;
      border: 1px solid #d9d9e4;
      padding: 10px 14px;
      font-size: 16px;
    }

    .btn-soft:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo {
      border: 1px solid #d8d8e2;
      border-radius: 13px;
      background: var(--card-strong);
      padding: 12px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .todo.done .todo-title {
      text-decoration: line-through;
      color: #8a89a3;
    }

    .todo-check {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid #c2c1d2;
      background: #fff;
      cursor: pointer;
      position: relative;
      margin: 0;
    }

    .todo-check:checked {
      border-color: #5e9f73;
      background: #5e9f73;
    }

    .todo-check:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .todo-title {
      font-size: 23px;
      line-height: 1.2;
      word-break: break-word;
    }

    .todo-actions {
      display: inline-flex;
      gap: 7px;
    }

    .btn-inline {
      background: #f4f4f9;
      color: #2f2d5e;
      border: 1px solid #d7d7e2;
      padding: 8px 12px;
      font-size: 14px;
    }

    .btn-inline:hover {
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #f3bdc2;
      padding: 8px 14px;
      font-size: 14px;
    }

    .stats {
      margin-top: 10px;
      font-size: 15px;
      color: #676787;
    }

    .status {
      margin-top: 8px;
      min-height: 20px;
      font-size: 14px;
      color: #875523;
    }

    .empty {
      border: 1px dashed #d3d2df;
      border-radius: 12px;
      color: #777696;
      padding: 22px;
      text-align: center;
      font-size: 16px;
      background: #fbfbfe;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: calc(100% - 20px);
        margin: 24px auto;
      }

      .sub {
        font-size: 18px;
      }

      .composer form {
        grid-template-columns: 1fr;
      }

      .btn-primary {
        padding: 12px;
        font-size: 18px;
      }

      .todo {
        grid-template-columns: auto 1fr;
      }

      .todo-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .todo-title {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="label">Focus Dashboard</div>
    <h1>Pulse Tasks</h1>
    <p class="sub">A colorful daily command center for what matters most.</p>

    <section class="composer">
      <form id="create-form">
        <input id="new-title" type="text" placeholder="What needs to get done?" maxlength="255" />
        <button class="btn-primary" type="submit">Add Task</button>
      </form>
      <div class="status" id="status"></div>
    </section>

    <section class="todos">
      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Todo filters">
          <button type="button" class="active" data-filter="all">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <button type="button" class="btn-soft" id="clear-completed">Clear Completed</button>
      </div>

      <ul class="list" id="todo-list"></ul>
      <div class="stats" id="stats"></div>
    </section>
  </main>

  <script>
    const state = {
      todos: [],
      filter: 'all',
      editingId: null,
      loading: false,
    };

    const elements = {
      form: document.getElementById('create-form'),
      newTitle: document.getElementById('new-title'),
      list: document.getElementById('todo-list'),
      stats: document.getElementById('stats'),
      status: document.getElementById('status'),
      clearCompleted: document.getElementById('clear-completed'),
      filters: document.querySelectorAll('[data-filter]'),
    };

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        headers: {
          'Content-Type': 'application/json',
        },
        ...options,
      });

      const body = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(body.message || 'Something went wrong');
      }

      return body;
    }

    function setStatus(message = '') {
      elements.status.textContent = message;
    }

    function visibleTodos() {
      if (state.filter === 'active') {
        return state.todos.filter((todo) => !todo.is_completed);
      }

      if (state.filter === 'completed') {
        return state.todos.filter((todo) => Boolean(todo.is_completed));
      }

      return state.todos;
    }

    function renderStats() {
      const total = state.todos.length;
      const completed = state.todos.filter((todo) => Boolean(todo.is_completed)).length;
      const active = total - completed;

      elements.stats.textContent = `${total} total • ${active} active • ${completed} completed`;
      elements.clearCompleted.disabled = completed === 0;
    }

    function renderFilters() {
      elements.filters.forEach((button) => {
        button.classList.toggle('active', button.dataset.filter === state.filter);
      });
    }

    function todoMarkup(todo) {
      const safeTitle = escapeHtml(todo.title || 'Untitled Task');
      const isEditing = state.editingId === todo.id;

      if (isEditing) {
        return `
          <li class="todo ${todo.is_completed ? 'done' : ''}" data-id="${todo.id}">
            <input class="todo-check" type="checkbox" ${todo.is_completed ? 'checked' : ''} data-action="toggle" />
            <input class="edit-input" type="text" value="${safeTitle}" maxlength="255" data-action="save-input" />
            <div class="todo-actions">
              <button type="button" class="btn-inline" data-action="save">Save</button>
              <button type="button" class="btn-inline" data-action="cancel">Cancel</button>
            </div>
          </li>
        `;
      }

      return `
        <li class="todo ${todo.is_completed ? 'done' : ''}" data-id="${todo.id}">
          <input class="todo-check" type="checkbox" ${todo.is_completed ? 'checked' : ''} data-action="toggle" />
          <div class="todo-title" title="${safeTitle}">${safeTitle}</div>
          <div class="todo-actions">
            <button type="button" class="btn-inline" data-action="edit">Edit</button>
            <button type="button" class="btn-danger" data-action="delete">Delete</button>
          </div>
        </li>
      `;
    }

    function renderTodos() {
      const todos = visibleTodos();

      if (todos.length === 0) {
        const emptyMessage =
          state.filter === 'all'
            ? 'No tasks yet. Add your first task above.'
            : state.filter === 'active'
              ? 'No active tasks right now.'
              : 'No completed tasks yet.';

        elements.list.innerHTML = `<li class="empty">${emptyMessage}</li>`;
        return;
      }

      elements.list.innerHTML = todos.map(todoMarkup).join('');
    }

    function renderAll() {
      renderFilters();
      renderTodos();
      renderStats();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadTodos() {
      state.loading = true;
      setStatus('Loading tasks...');

      try {
        const result = await apiRequest('/api/todos');
        state.todos = Array.isArray(result.data) ? result.data : [];
        setStatus('');
      } catch (error) {
        setStatus(error.message);
      } finally {
        state.loading = false;
        renderAll();
      }
    }

    async function addTodo(title) {
      try {
        await apiRequest('/api/todos', {
          method: 'POST',
          body: JSON.stringify({ title, description: null }),
        });

        elements.newTitle.value = '';
        setStatus('Task added.');
        await loadTodos();
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function toggleTodo(id, nextValue) {
      try {
        await apiRequest(`/api/todos/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ is_completed: nextValue }),
        });

        await loadTodos();
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function saveTodo(id, title) {
      if (!title.trim()) {
        setStatus('Task title cannot be empty.');
        return;
      }

      try {
        await apiRequest(`/api/todos/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ title: title.trim() }),
        });

        state.editingId = null;
        await loadTodos();
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function deleteTodo(id) {
      try {
        await apiRequest(`/api/todos/${id}`, {
          method: 'DELETE',
        });

        await loadTodos();
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function clearCompleted() {
      const completedIds = state.todos
        .filter((todo) => Boolean(todo.is_completed))
        .map((todo) => todo.id);

      if (completedIds.length === 0) {
        return;
      }

      try {
        await Promise.all(
          completedIds.map((id) => apiRequest(`/api/todos/${id}`, { method: 'DELETE' }))
        );
        setStatus('Completed tasks cleared.');
        await loadTodos();
      } catch (error) {
        setStatus(error.message);
      }
    }

    elements.form.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = elements.newTitle.value.trim();

      if (!title) {
        setStatus('Please type a task first.');
        return;
      }

      addTodo(title);
    });

    elements.filters.forEach((button) => {
      button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        renderAll();
      });
    });

    elements.clearCompleted.addEventListener('click', clearCompleted);

    elements.list.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) {
        return;
      }

      const todoEl = event.target.closest('[data-id]');
      if (!todoEl) {
        return;
      }

      const todoId = Number(todoEl.dataset.id);
      const todo = state.todos.find((item) => Number(item.id) === todoId);
      if (!todo) {
        return;
      }

      const action = actionEl.dataset.action;

      if (action === 'toggle') {
        toggleTodo(todoId, !todo.is_completed);
        return;
      }

      if (action === 'edit') {
        state.editingId = todoId;
        renderAll();
        const rerenderedTodo = elements.list.querySelector(`[data-id="${todoId}"]`);
        const input = rerenderedTodo ? rerenderedTodo.querySelector('.edit-input') : null;
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
        return;
      }

      if (action === 'cancel') {
        state.editingId = null;
        renderAll();
        return;
      }

      if (action === 'save') {
        const input = todoEl.querySelector('.edit-input');
        saveTodo(todoId, input ? input.value : '');
        return;
      }

      if (action === 'delete') {
        deleteTodo(todoId);
      }
    });

    elements.list.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') {
        return;
      }

      const input = event.target.closest('.edit-input');
      if (!input) {
        return;
      }

      const todoEl = event.target.closest('[data-id]');
      if (!todoEl) {
        return;
      }

      saveTodo(Number(todoEl.dataset.id), input.value);
    });

    loadTodos();
  </script>
</body>
</html>
