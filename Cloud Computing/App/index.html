<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-shape shape-a" aria-hidden="true"></div>
  <div class="bg-shape shape-b" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">FOCUS DASHBOARD</p>
      <h1>Pulse Tasks</h1>
      <p class="subtitle">A colorful daily command center for what matters most.</p>
    </header>

    <section class="card create-card" aria-label="Create todo">
      <form id="todo-form">
        <div class="input-wrap">
          <input id="todo-input" type="text" placeholder="What needs to get done?" maxlength="120" autocomplete="off" required />
          <button class="btn primary" type="submit">Add Task</button>
        </div>
      </form>
      <p id="form-error" class="error" aria-live="polite"></p>
    </section>

    <section class="card panel" aria-label="Todo controls and list">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter todos">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
        <button id="clear-completed" class="btn ghost" type="button">Clear Completed</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="footer-row">
        <p id="stats">0 total • 0 active • 0 completed</p>
      </footer>
    </section>
  </main>

  <template id="todo-item-template">
    <li class="todo-item">
      <label class="todo-main">
        <input class="toggle" type="checkbox" />
        <span class="checkmark" aria-hidden="true"></span>
        <span class="task-text"></span>
      </label>
      <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
